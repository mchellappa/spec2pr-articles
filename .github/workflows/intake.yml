name: Intake Ideas

on:
  push:
    branches: [main]
    paths:
      - "ideas/**"
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate idea files exist
        run: |
          set -euo pipefail
          count=$(find ideas -maxdepth 1 -type f -name '*.md' | awk 'END { print NR + 0 }')
          echo "Detected $count idea file(s)."
          if [ "$count" -eq 0 ]; then
            echo "No idea markdown files found in /ideas."
            exit 1
          fi

      - name: Upload intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideas-intake
          path: ideas/*.md
          if-no-files-found: error
